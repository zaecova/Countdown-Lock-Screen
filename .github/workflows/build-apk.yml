name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'fondo.jpg'
      - 'android-widget/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare app assets
        run: |
          mkdir -p android-widget/app/src/main/assets
          cp index.html android-widget/app/src/main/assets/index.html
          cp fondo.jpg android-widget/app/src/main/assets/fondo.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android-widget/app/src/main/assets/index.html")
          html = p.read_text(encoding="utf-8")
          html = html.replace(
              "https://raw.githubusercontent.com/zaecova/Countdown-Lock-Screen/main/fondo.jpg",
              "./fondo.jpg"
          )
          responsive = """
          <style>
            html, body { width:100%; min-height:100%; margin:0; padding:0; overflow-x:hidden; }
            body { min-height:100vh; min-height:100dvh; padding:0 !important; }
            .phone-container {
              width:100%; max-width:none !important; height:100vh; height:100dvh;
              min-height:100vh; border-radius:0 !important; border:0 !important;
              box-shadow:none !important;
            }
          </style>
          """
          html = html.replace("</head>", responsive + "\n</head>")
          p.write_text(html, encoding="utf-8")
          PY

      - name: Build debug APK
        working-directory: android-widget
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: countdown-lock-screen-debug-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
